<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding of Aaron & Ram</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background-color: #faf5f0; 
            color: #333;
            text-align: center;
        }
        header {
            background-color: #e8d5c4;
            padding: 60px 20px;
        }
        h1 {
            font-size: 3.5em;
            margin: 0;
            color: #5a4b41;
        }
        .date {
            font-size: 1.5em;
            margin-top: 10px;
            color: #7a6b61;
            font-style: italic;
        }
        section {
            padding: 40px 20px;
        }
        .container {
            background-color: white;
            margin: 20px auto;
            max-width: 600px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h3 {
            color: #5a4b41;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        button {
            background-color: #5a4b41;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #3b312a;
        }
    </style>
</head>
<body>

    <header>
        <h1>Aaron & Ram</h1>
        <p class="date">[Date of Wedding, e.g., February 14, 2027]</p>
    </header>

    <section>
        <h2>You are invited to our special day!</h2>
        
        <div class="container">
            <h3>When & Where</h3>
            <p><strong>Location:</strong> Tagaytay</p>
            <p><strong>Venue:</strong> [Specific Name of Venue / Church]</p>
            <p><strong>Time:</strong> [Time of Wedding, e.g., 3:00 PM]</p>
        </div>

        <div class="container">
            <h3>RSVP</h3>
            <p>Please confirm your attendance by [Deadline Date].</p>
            <!-- Replace [YOUR_FORM_LINK] with your actual Google Form or RSVP link -->
            <button onclick="window.location.href='[YOUR_FORM_LINK]'">RSVP Here</button>
        </div>
    </section>

</body>
</html>
